name: build-and-deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Build and push image
        run: make build-image-push

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Login to ECR
        run: make ecr-login  # ← Fixed indentation here

      - name: Pull latest image
        run: make build-image-pull

      - name: Run container locally
        run: make up

      - name: Stop container
        if: always()
        run: make down

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-lock
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Login to ECR  # ← Add this to deploy job too
        run: make ecr-login

      - name: Pull latest image
        run: make build-image-pull

      - name: Promote image and deploy
        run: |
          BUILD_TAG=staging
          if [[ "${GITHUB_REF}" == "refs/heads/prod" ]]; then
            BUILD_TAG=prod
          fi
          make BUILD_TAG=$BUILD_TAG build-image-promote
          chmod +x ./deploy.sh
          ./deploy.sh $BUILD_TAG fraud-detection-service